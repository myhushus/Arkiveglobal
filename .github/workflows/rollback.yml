name: Approved baseline rollback
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'After explicit approval, type ROLLBACK ARKIVE GLOBAL'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'ROLLBACK ARKIVE GLOBAL'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/prepare-rollback.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .artifacts/rollback
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Restore approved original artifact
        id: deployment
        uses: actions/deploy-pages@v4
